<div class="home-container">
  <h1>Bienvenue à la Bibliothèque</h1>
  
  <div *ngIf="loading" class="loading">Chargement des statistiques...</div>
  
  <div *ngIf="error" class="error-message">{{ error }}</div>
  
  <div class="stats-grid" *ngIf="!loading">
    <div class="stat-card">
      <h3>Livres</h3>
      <p class="stat-number">{{ stats.livres }}</p>
    </div>
    <div class="stat-card">
      <h3>Revues</h3>
      <p class="stat-number">{{ stats.revues }}</p>
    </div>
    <div class="stat-card">
      <h3>Auteurs</h3>
      <p class="stat-number">{{ stats.auteurs }}</p>
    </div>
    <div class="stat-card">
      <h3>Enseignants</h3>
      <p class="stat-number">{{ stats.enseignants }}</p>
    </div>
    <div class="stat-card">
      <h3>Étudiants</h3>
      <p class="stat-number">{{ stats.etudiants }}</p>
    </div>
    <div class="stat-card">
      <h3>Particuliers</h3>
      <p class="stat-number">{{ stats.particuliers }}</p>
    </div>
  </div>

  <div class="actions">
    <button (click)="navigateTo('list-ressources')" class="btn btn-primary">
      Voir les Ressources
    </button>
    <button (click)="navigateTo('list-users')" class="btn btn-primary">
      Voir les Utilisateurs
    </button>
    <button (click)="navigateTo('create-user')" class="btn btn-success">
      Ajouter un Utilisateur
    </button>
    <button (click)="logout()" class="btn btn-danger">
      Déconnexion
    </button>
  </div>
</div>
