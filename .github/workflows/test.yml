name: Bibliothèque CI/CD - Tests

on:
  workflow_call:

# ──────────────────────────────────────────────
# TESTS
# ──────────────────────────────────────────────
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run backend tests
        working-directory: Bibliotheque-Back/Bibliotheque
        run: chmod +x mvnw && ./mvnw -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Bibliotheque-Front/package-lock.json
      - name: Install frontend dependencies
        working-directory: Bibliotheque-Front
        run: npm ci

      - name: Run frontend tests
        working-directory: Bibliotheque-Front
        run: npm run test -- --watch=false
