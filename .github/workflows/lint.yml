name: Bibliothèque Spring Angular - Lint
on:
  workflow_call:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Lint Backend with Checkstyle
        run: |
          cd Bibliotheque-Back/Bibliotheque
          chmod +x mvnw
          ./mvnw checkstyle:check -Dcheckstyle.config.location=checkstyle.xml

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Lint Frontend with ESLint
        run: |
          cd Bibliotheque-Front
          npm ci
          npm i eslint
          npx eslint --ext .ts,.tsx src/
