name: Comme tu veux

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Bibliotheque Front/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install frontend dependencies
        working-directory: Bibliotheque Front
        run: npm ci

      - name: Run frontend tests
        working-directory: Bibliotheque Front
        run: npm run test -- --watch=false

      - name: Run backend tests
        working-directory: Bibliotheque Back/Bibliotheque
        run: chmod +x mvnw && ./mvnw -B test

      - name: Build app
        working-directory: Bibliotheque Front
        run: npm run build
