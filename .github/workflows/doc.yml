# ════════════════════════════════════════════════
# Bibliothèque CI/CD — Documentation
# ════════════════════════════════════════════════
name: Bibliothèque CI/CD - Documentation

on:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false # ne pas couper un déploiement en cours

# ════════════════════════════════════════════════
# BUILD — Documentation Zensical
# ════════════════════════════════════════════════
jobs:
  build-docs:
    name: Build Docs (Zensical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies & build
        run: |
          pip install -r docs/requirements.txt
          zensical build --clean

      - name: Verify site output
        run: | # ← P6 : validation
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html introuvable — le build zensical a échoué"
            exit 1
          fi

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 5 # ← P4

  # ════════════════════════════════════════════════
  # BUILD — Swagger / OpenAPI
  # ════════════════════════════════════════════════
  build-swagger:
    name: Build Swagger
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ← P3 : timeout
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # ← A3 : v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven # ← P1 : cache Maven

      - name: Set up Node.js # ← A6 : version explicite
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build backend
        working-directory: Bibliotheque-Back/Bibliotheque
        run: chmod +x mvnw && ./mvnw -B package -DskipTests

      - name: Start backend & wait for readiness
        working-directory: Bibliotheque-Back/Bibliotheque
        run: | # ← A4 + A5 : corrigés
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::Aucun JAR trouvé dans target/"
            exit 1
          fi

          java -jar "$JAR" &
          echo $! > /tmp/backend.pid

          echo "Attente du backend (max 60 s)…"
          READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              READY=true
              echo "✅ Backend prêt après $((i*2)) s"
              break
            fi
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Le backend n'a pas démarré dans les 60 s"
            cat target/*.log 2>/dev/null || true
            exit 1
          fi

      - name: Download OpenAPI spec
        run: |
          curl -sf http://localhost:8080/v3/api-docs      -o openapi.json
          curl -sf http://localhost:8080/v3/api-docs.yaml -o openapi.yaml

      - name: Generate Swagger UI (static)
        run: |
          npx --yes @redocly/cli build-docs openapi.json \
            --output swagger-ui/index.html \
            --title "Bibliothèque API"
          cp openapi.json swagger-ui/openapi.json
          cp openapi.yaml swagger-ui/openapi.yaml

      - name: Stop backend
        if: always()
        run: |
          [ -f /tmp/backend.pid ] && kill "$(cat /tmp/backend.pid)" 2>/dev/null || true

      - name: Upload swagger artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger-ui
          path: swagger-ui/
          retention-days: 5 # ← P4

  # ════════════════════════════════════════════════
  # DEPLOY — Fusion des deux sites sur GitHub Pages
  # ════════════════════════════════════════════════
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [build-docs, build-swagger]
    runs-on: ubuntu-latest
    timeout-minutes: 10 # ← P3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Download swagger artifact
        uses: actions/download-artifact@v4
        with:
          name: swagger-ui
          path: site/swagger/

      - name: Setup Pages # ← A2 : configure-pages ici uniquement
        uses: actions/configure-pages@v4 # ← A3 : v4

      - name: Upload merged site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
