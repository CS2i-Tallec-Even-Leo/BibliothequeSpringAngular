spring.application.name=Bibliotheque

# H2 file-based (persistent across restarts)
spring.datasource.url=jdbc:h2:file:./bibliothequedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.error.include-message=always
server.error.include-binding-errors=always
# Comptes de connexion applicatifs (mode simple)
library.admin.email=admin@bibliotheque.local
library.admin.password=admin123

# Expediteur utilise pour les notifications de retard
library.notifications.from=no-reply@bibliotheque.local

management.endpoints.web.exposure.include=health
